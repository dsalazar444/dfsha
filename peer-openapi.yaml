openapi: 3.0.3
info:
  title: DFSha - Peer API
  description: >
    API exposed by each DFSha peer. A peer is both a client and a
    storage node: it receives, serves, and deletes chunks upon
    requests from other peers, coordinated by the superpeer.

    Design note: for now the peer does not validate user/permission
    tokens for chunk reads — it is assumed that if the superpeer
    provided the peer URL, it already validated the requester correctly.
    This is documented as a pending decision for a future signed
    access-token layer per chunk (see the requirements repository,
    pending decisions).
  version: "0.1.0"

servers:
  - url: http://localhost:9000
    description: Local peer (development)

tags:
  - name: chunks

paths:

  /chunks/receive:
    post:
      tags: [chunks]
      summary: >
        Receives a chunk from another peer (or from the owner peer during a
        put). Verifies integrity against the expected hash.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [chunk, expected_hash]
              properties:
                chunk:
                  type: string
                  format: binary
                expected_hash:
                  type: string
                  description: Expected SHA256 of the chunk
      responses:
        "200":
          description: Chunk received and verified successfully
        "400":
          description: >
            Hash mismatch (corrupted chunk). The client must retry the upload
            with another replica peer from the list, not with the same one.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/ServerError"

  /chunks/{chunk_id}:
    get:
      tags: [chunks]
      summary: Serves a chunk to anyone who requests it
      parameters:
        - in: path
          name: chunk_id
          required: true
          schema:
            type: string
          description: "Identifier in the form: {file_id}_{chunk_index}"
      responses:
        "200":
          description: Chunk found
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          description: The peer does not have this chunk
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/ServerError"

    delete:
      tags: [chunks]
      summary: >
        Deletes a chunk. Relaxed/eventual deletion: responds 200 as soon as
        the deletion process starts, like file deletion on the superpeer.
      parameters:
        - in: path
          name: chunk_id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deletion started
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Starting deletion"
        "500":
          $ref: "#/components/responses/ServerError"

components:
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string

  responses:
    ServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"