openapi: 3.0.3
info:
  title: DFSha - Superpeer API
  description: >
    API for the Superpeer in DFSha (centralized P2P, phase 1).
    It coordinates metadata, users, chunk locations, and peer health.
    It does not transfer file bytes: only coordinates them, while chunks
    travel peer-to-peer.
  version: "0.1.0"

servers:
  - url: http://localhost:8080
    description: Local superpeer (development)

security:
  - bearerAuth: []

tags:
  - name: auth
  - name: peers
  - name: fs
  - name: files
  - name: locks

paths:

  /auth/login:
    post:
      tags: [auth]
      summary: User login
      security: []  # public endpoint, does not require a token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                password:
                  type: string
                  format: password
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  session_token:
                    type: string
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/ServerError"

  /peers/register:
    post:
      tags: [peers]
      summary: Register an authenticated client as a peer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [address, port]
              properties:
                address:
                  type: string
                  example: "192.168.1.10"
                port:
                  type: string
                  example: "9000"
      responses:
        "200":
          description: Peer registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  peer_id:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"

  /peers/heartbeat:
    post:
      tags: [peers]
      summary: >
        Periodic heartbeat from a peer. It does not include an "status"
        field: the superpeer infers health solely from the arrival of the
        heartbeat within the configured timeout.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [peer_id, available_space, chunks]
              properties:
                peer_id:
                  type: string
                available_space:
                  type: string
                  description: Free space reported by the peer (for example, available bytes)
                chunks:
                  type: array
                  description: List of chunk_id currently held by the peer
                  items:
                    type: string
      responses:
        "200":
          description: Heartbeat received
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: peer_id is not registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/ServerError"

  /fs/mkdir:
    post:
      tags: [fs]
      summary: Create a logical directory (metadata only; no chunk handling)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path:
                  type: string
                  description: Absolute path in the user's logical namespace
                  example: "/docs/thesis"
      responses:
        "200":
          description: Directory created
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"

  /fs/rmdir:
    delete:
      tags: [fs]
      summary: Delete a logical directory (metadata only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path:
                  type: string
                  example: "/docs/thesis"
      responses:
        "200":
          description: Directory deleted
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /fs/ls:
    get:
      tags: [fs]
      summary: >
        Lists the contents of a logical directory. There is no
        "cd" endpoint: the current working directory is a purely
        local client concept, which always sends absolute paths here.
      parameters:
        - in: query
          name: path
          required: true
          schema:
            type: string
          example: "/docs"
      responses:
        "200":
          description: Directory listing
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        type:
                          type: string
                          enum: [file, directory]
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /files/put/init:
    post:
      tags: [files]
      summary: >
        Starts an upload: the client has already split the file and
        calculated the hash per chunk. The superpeer creates the file_id
        and assigns destination peers per chunk according to the
        replication factor.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [logical_path, chunk_count, hash_of_each_chunk]
              properties:
                logical_path:
                  type: string
                  example: "/docs/thesis/chapter1.pdf"
                chunk_count:
                  type: integer
                hash_of_each_chunk:
                  type: array
                  items:
                    type: string
                    description: SHA256 of each chunk, in order
      responses:
        "200":
          description: Destination assignment generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  file_id:
                    type: string
                  assignment:
                    type: array
                    items:
                      type: object
                      properties:
                        chunk_id:
                          type: string
                          description: "Compound: {file_id}_{chunk_index}"
                        destination_peers:
                          type: array
                          items:
                            type: string
                            description: "Peer destination URL, e.g. http://192.168.1.10:9000"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"

  /files/put/ack:
    post:
      tags: [files]
      summary: A peer confirms that it received and verified a chunk
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [chunk_id, peer_id]
              properties:
                chunk_id:
                  type: string
                peer_id:
                  type: string
      responses:
        "200":
          description: ACK registered
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: chunk_id does not correspond to any initiated upload, or peer_id does not exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/ServerError"

  /files/get/{path}:
    get:
      tags: [files]
      summary: >
        Returns the location of a file's chunks by resolving the logical
        path to the internal file_id.
      parameters:
        - in: path
          name: path
          required: true
          schema:
            type: string
          example: "docs/thesis/chapter1.pdf"
      responses:
        "200":
          description: Chunk locations
          content:
            application/json:
              schema:
                type: object
                properties:
                  file_id:
                    type: string
                  chunks:
                    type: array
                    items:
                      type: object
                      properties:
                        chunk_id:
                          type: string
                        peers:
                          type: array
                          items:
                            type: string
                            description: >
                              URLs of peers that have this chunk (several,
                              to allow retry if any are down)
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /files/{path}:
    delete:
      tags: [files]
      summary: >
        Deletes a file. Relaxed/eventual deletion: responds 200 as soon
        as the deletion process starts, without waiting for all peers to
        confirm. It is used by the superpeer to complete rmdir.
      parameters:
        - in: path
          name: path
          required: true
          schema:
            type: string
          example: "docs/thesis/chapter1.pdf"
      responses:
        "200":
          description: Deletion started
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Starting file deletion"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /files/lock/{path}:
    post:
      tags: [locks]
      summary: >
        Requests a write lock on a file. Called internally by the client as
        part of the "modify" command and never directly by the CLI user.
      parameters:
        - in: path
          name: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Lock granted
          content:
            application/json:
              schema:
                type: object
                properties:
                  lock_id:
                    type: string
                  expires_at:
                    type: string
                    format: date-time
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The file is already locked by another user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/ServerError"

  /files/unlock/{path}:
    post:
      tags: [locks]
      summary: Releases a write lock. Idempotent.
      parameters:
        - in: path
          name: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lock_id]
              properties:
                lock_id:
                  type: string
      responses:
        "200":
          description: Lock released
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: The lock has expired or does not exist (not a fatal error)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/ServerError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Session token obtained from /auth/login

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string

  responses:
    BadRequest:
      description: Malformed body or missing required fields
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing or expired token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Authenticated but without permission on the resource
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource does not exist
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"